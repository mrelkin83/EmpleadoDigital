# Infraestructura de desarrollo local.
# Laragon no incluye PostgreSQL, por eso se provee vía Docker (puerto 5433 para no chocar con otros servicios).
# Redis ya existe en Laragon (C:\laragon\bin\redis); se incluye aquí como alternativa homogénea.
services:
  postgres:
    image: postgres:16-alpine
    container_name: empleado-postgres
    environment:
      POSTGRES_USER: empleado
      POSTGRES_PASSWORD: empleado
      POSTGRES_DB: empleado_digital
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: empleado-redis
    ports:
      - "6380:6379"

volumes:
  pgdata:
